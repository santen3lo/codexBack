version: '3.8'

services:
  llm-compare:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: llm-compare-app
    ports:
      - "8000:8000"
    environment:
      - AI_PROXY_TOKEN=${AI_PROXY_TOKEN:-}
      - AI_PROXY_BASE_URL=${AI_PROXY_BASE_URL:-http://llm.codex.so}
      - DEFAULT_TIMEOUT_SECONDS=60.0
      - PORT=8000
    env_file:
      - .env
    restart: unless-stopped
